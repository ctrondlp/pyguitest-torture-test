[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyguitest-torture-test"
dynamic = ["version"]
description = "A Qt desktop app stuffed with every control, as a worst-case test target for pyguitest"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Dennis K. Paulsen"}]
keywords = ["gui", "testing", "accessibility", "qt", "pyside6", "at-spi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PySide6"]

# The validation drivers in drivers/ are not installed with the app and are
# not part of this distribution: they are scripts copied to a test box and run
# there, and they need pyguitest (and, for a recording run,
# pyguitest-recorder) rather than PySide6. Install those on the driving side.
[project.optional-dependencies]
drivers = ["pyguitest"]

[project.urls]
Homepage = "https://github.com/ctrondlp/pyguitest-torture-test"
"pyguitest" = "https://github.com/ctrondlp/pyguitest"

[project.gui-scripts]
torture-test = "torture_test.app:main"

[tool.setuptools]
# The app package only. `tests` and `drivers` are deliberately excluded:
# neither is importable library code.
packages = ["torture_test", "torture_test.pages"]

[tool.setuptools.dynamic]
version = {attr = "torture_test.__version__"}

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["torture_test", "tests", "drivers"]

[tool.ruff.lint]
# Deliberately the same selection pyguitest uses, so a contributor moving
# between the two repos meets one style rather than two.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "D",        # pydocstyle
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplification
    "RET",      # return consistency
    "ARG",      # unused arguments
    "C901",     # cyclomatic complexity
]
ignore = [
    "D203",    # incompatible with D211; keep no blank line before class docstring
    "D213",    # incompatible with D212; keep the summary on the first line
    "D401",    # properties read better as noun phrases than imperatives
    "D105",    # __enter__/__exit__ and friends document themselves
]

[tool.ruff.lint.mccabe]
# A ceiling on what gets added, not a claim the tree is already under it.
# The drivers are over it (see their per-file ignore); the app is not.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# The drivers are standalone scripts copied to a test box and run there, not
# library code, and they are held to a looser standard on purpose:
#
# C901    each one is a long linear drive sequence; splitting it would scatter
#         a procedure whose whole value is being readable top to bottom.
# D103    the local helpers inside a script are named for what they do.
# SIM105  `try/except Exception: pass` around a toolkit call is deliberate and
#         clearer here than contextlib.suppress -- a driver must never die
#         because one probe failed.
# ARG001  a callback's signature is fixed by its caller, used argument or not.
# D205    many summaries are a single sentence that needs more than one line.
#         Shortening them to fit would cost detail these docstrings exist to
#         carry -- each records a live-verified platform finding, often the
#         only written record of why a step is shaped the way it is.
# E501    docstrings and comments only, wrapped to the ~76 columns these files
#         already use. Verified: no *code* line in drivers/ exceeds 88, so
#         this relaxes prose width and nothing else.
#
# Every *correctness* rule (F, B, UP, C4, RET) stays on for the drivers; what
# is relaxed here is prose formatting only. Revisit if the drivers are ever
# de-duplicated into a shared module -- the shared copy should meet the full
# standard the app package already does.
"drivers/*.py" = ["C901", "D103", "SIM105", "ARG001", "D205", "E501"]
# The self-test's widget-poking helpers are exhaustive isinstance ladders.
"tests/*.py" = ["C901"]
# Generated by pyguitest-recorder and kept verbatim as a worked example --
# editing it to satisfy a linter would misrepresent what the recorder emits.
"examples/*.py" = ["D", "E", "W", "F", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "C901"]
